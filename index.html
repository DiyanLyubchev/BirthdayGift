<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Birthday Surprise — Real Europe Map</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />   
    <style>
        :root{
            --panel:#0b1220cc; --bg:#0f1722; --accent:#f59e0b;
            --removed:#071225; --ok:#10b981; --bad:#ef4444;
        }
        html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;color:#e6eef6;background:linear-gradient(180deg,#071428 0%, #071a2a 60%);display:flex;align-items:flex-start;justify-content:center;padding:24px 0;box-sizing:border-box;min-height:100vh;}
        .card{width:1120px;max-width:96vw;background:var(--panel);padding:18px;border-radius:12px;box-shadow:0 10px 30px rgba(2,6,23,0.6);backdrop-filter:blur(4px);}
        header{display:flex;align-items:center;gap:12px;margin-bottom:10px}
        h1{font-size:18px;margin:0}
        p{margin:6px 0 14px;color:#bcd2ea;font-size:13px}
        .map-wrap{background:linear-gradient(180deg,#0a1a2a, #07202d);border-radius:10px;padding:12px;display:flex;justify-content:center;align-items:center}
        svg{width:100%;max-width:1080px;height:auto;max-height:82vh;overflow:hidden;border-radius:6px;display:block}
        .country{fill:#7fb3d5;stroke:#062331;stroke-width:0.7;cursor:pointer;transition:opacity .6s, transform .35s, filter .3s;}
        .country:hover{transform:translateY(-3px) scale(1.02);filter:drop-shadow(0 6px 10px rgba(3,10,20,0.6));}
        .removed{opacity:0;pointer-events:none;filter:grayscale(1) brightness(.6);transform:scale(.98) !important;}
        .controls{display:flex;gap:8px;align-items:center;margin-top:12px}
        button{background:#0b1724;border:1px solid rgba(255,255,255,0.06);color:#dff0ff;padding:8px 12px;border-radius:8px;cursor:pointer}
        button.secondary{background:#08202a;color:#bfe3ee}
        .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(2,6,23,0.55)}
        .modal.show{display:flex}
        .dialog{background:#071428;padding:20px;border-radius:10px;color:#e6f6ff;min-width:260px;text-align:center;box-shadow:0 18px 40px rgba(2,6,23,0.6)}
        .dialog h2{margin:0 0 8px;font-size:18px}
        .dialog p{margin:0 0 12px;color:#bcd2ea;font-size:14px}
        .country-label{display:none;font-size:10px;fill:#dff6ff;font-weight:600;pointer-events:none;text-anchor:middle;}
        .popup{
            position:absolute;background:linear-gradient(180deg,#091b2a,#06202a);color:#e6f6ff;padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);
            box-shadow:0 8px 20px rgba(0,0,0,0.6);white-space:nowrap;transform:translate(-50%,-120%);z-index:10002;font-size:13px;
        }
        .dice{width:76px;height:76px;display:flex;align-items:center;justify-content:center;background:#062b3a;border-radius:10px;border:1px solid rgba(255,255,255,0.04)}
        .die{font-size:32px;color:#e6f6ff;font-weight:700;transition:transform 700ms cubic-bezier(.2,.9,.2,1)}
        .die.spinning{transform:rotateX(1080deg) rotateY(720deg)}
    </style>
    <style>
        /* Responsive tweaks: larger map on tablet/phone and extra-large on small portrait phones */
        @media (max-width: 900px){
            .card{width:98vw;max-width:98vw;padding:12px}
            svg{width:98vw;height:82vh}
            .map-wrap{padding:8px}
            .dialog{min-width:92vw}
        }

        @media (max-width: 640px){
            .card{padding:10px}
            svg{width:100vw;height:86vh}
            .map-wrap{padding:6px}
            .dice{width:96px;height:96px}
            .die{font-size:42px}
            h1{font-size:16px}
            p{font-size:14px}
            .dialog{min-width:94vw}
            .dialog h2{font-size:16px}
            .country-label{font-size:12px}
            .country{stroke-width:1.2}
        }

        @media (max-width: 420px) and (orientation: portrait){
            /* For narrow tall phones (e.g. iPhone portrait) maximize vertical space */
            svg{height:90vh}
            .card{padding-top:8px;padding-bottom:8px}
            .map-wrap{padding:4px}
        }
        /* Very narrow phones (iPhone portrait widths) - use stronger overrides */
        @media (max-width: 430px){
            html,body{padding:8px 0 !important}
            .card{width:100vw !important; max-width:100vw !important; margin:0 !important; border-radius:8px}
            .map-wrap{padding:4px !important}
            svg{width:100vw !important; height:calc(100vh - 140px) !important; max-height:none !important; display:block}
            .dice{width:90px !important; height:90px !important}
            .die{font-size:40px !important}
            .country{stroke-width:1.1 !important}
        }
        /* Aggressive full-bleed mobile layout for very narrow portrait phones */
        @media (max-width: 480px) and (orientation: portrait){
            html,body{height:100% !important; padding:0 !important}
            body{align-items:flex-start !important}
            .card{width:100vw !important; max-width:100vw !important; margin:0 !important; border-radius:0 !important; padding:6px !important; box-shadow:none !important}
            .map-wrap{width:100% !important; padding:0 !important; border-radius:0 !important; display:flex; justify-content:center; align-items:center}
            svg{width:100vw !important; height:calc(100vh - 120px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) !important; max-height:none !important; display:block}
            .dialog{min-width:96vw !important}
            .card > .controls{margin-top:8px}
        }
    </style>
</head>
<body>
    <div class="card" role="main">
        <header><h1>Birthday Surprise — Find the special country</h1></header>

        <div class="map-wrap">
            <svg id="map" viewBox="0 0 980 620" preserveAspectRatio="xMidYMid meet" aria-labelledby="mapTitle" role="img">
                <title id="mapTitle">Europe map for birthday game</title>
            </svg>
        </div>

        <div class="controls">
            <button id="resetBtn" class="secondary">Reset map</button>
            <div style="flex:1"></div>
        </div>
    </div>

    <div id="modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="dialog" role="document">
            <h2>You reached Germany — roll the dice</h2>
            <p style="margin-bottom:8px">Roll up to 3 times. Click Roll to spin.</p>
            <div style="display:flex;gap:12px;align-items:center;justify-content:center;margin-top:12px">
                <div id="dice" class="dice" aria-hidden="false">
                    <div class="die" id="dieFace">—</div>
                </div>
                <div style="display:flex;flex-direction:column;gap:8px;align-items:center">
                    <button id="rollDice">Roll</button>
                    <button id="resetFromModal" class="secondary">Reset map</button>
                    <button id="closeModal">Close</button>
                    <div id="rollInfo" style="font-size:13px;color:#bcd2ea;margin-top:6px">Rolls left: <span id="rollsLeft">3</span></div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson-client@3/dist/topojson-client.min.js"></script>

    <script>
    (function(){
        const svg = d3.select('#map');
        const width = 980, height = 620;
        const modal = document.getElementById('modal');
        const resetBtn = document.getElementById('resetBtn');
        const closeModal = document.getElementById('closeModal');
        const resetFromModal = document.getElementById('resetFromModal');
        const topoUrl = 'https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson';

        let countrySelection = null;
        let labelsSelection = null;
        let features = [];
        let path; 

        function showModal(){ modal.classList.add('show'); modal.setAttribute('aria-hidden','false'); }
        function hideModal(){ modal.classList.remove('show'); modal.setAttribute('aria-hidden','true'); }

        function resetMap(){
            if(!countrySelection) return;
            countrySelection.classed('removed', false).style('display', null).attr('transform', null);
            if(labelsSelection) labelsSelection.style('display', 'none').classed('removed', false);
            const win = document.getElementById('winOverlay');
            if(win) win.remove();
            document.querySelectorAll('.popup').forEach(p => p.remove());
            hideModal();

            // Reset dice state and UI so Roll is reset when map is reset
            try{
                if(typeof diceState !== 'undefined'){
                    diceState.rollsLeft = 3;
                    diceState.spinning = false;
                }
                const dieEl = document.getElementById('dieFace');
                if(dieEl){
                    dieEl.classList.remove('spinning');
                    dieEl.textContent = '—';
                }
                const rollsLeftDisplay = document.getElementById('rollsLeft');
                if(rollsLeftDisplay) rollsLeftDisplay.textContent = '3';
                const rollInfoEl = document.getElementById('rollInfo');
                if(rollInfoEl) rollInfoEl.textContent = 'Rolls left: ';
            }catch(e){
                // ignore if elements not yet present
            }
        }

        function getName(d){
            if(!d || !d.properties) return '';
            return d.properties.ADMIN || d.properties.NAME || d.properties.name || d.properties.country || d.id || '';
        }

        fetch(topoUrl).then(r => {
            if(!r.ok) throw new Error('Network response was not ok: ' + r.status);
            return r.json();
        }).then(raw => {
            let geo;
            if(raw.type === 'Topology'){
                const objName = Object.keys(raw.objects)[0];
                geo = topojson.feature(raw, raw.objects[objName]);
            } else if(raw.type === 'FeatureCollection'){
                geo = raw;
            } else {
                throw new Error('Unsupported geo data format');
            }
            const europeFeatures = geo.features.filter(f => {
                const c = d3.geoCentroid(f);
                if(!Array.isArray(c)) return false;
                const lon = c[0], lat = c[1];
                return lon > -30 && lon < 60 && lat > 30 && lat < 72;
            });

            features = europeFeatures;

            // Create a projection sized to the SVG's viewBox (keeps geographic coords stable
            // while the SVG scales responsively). This preserves centering when CSS scales the svg.
            let projection;
            function createProjection(){
                const svgNode = svg.node();
                let vbw = width, vbh = height;
                try{
                    const vb = svgNode.viewBox && svgNode.viewBox.baseVal;
                    if(vb && vb.width && vb.height){ vbw = vb.width; vbh = vb.height; }
                }catch(e){ /* ignore */ }

                projection = d3.geoMercator()
                    .rotate([10,0])
                    .fitSize([vbw, vbh], { type: 'FeatureCollection', features });

                return projection;
            }

            // initial projection + path generator
            createProjection();
            path = d3.geoPath().projection(projection);

            countrySelection = svg.selectAll('path.country')
                .data(features, d => getName(d))
                .join('path')
                .attr('class','country')
                .attr('d', path)
                .attr('data-name', d => getName(d))
                .attr('id', d => {
                    const name = getName(d) || 'unknown';
                    return 'c_' + name.replace(/[^a-z0-9]+/ig,'_');
                })
                .each(function(d){
                    const name = getName(d) || 'Country';
                    const t = document.createElementNS('http://www.w3.org/2000/svg','title');
                    t.textContent = name;
                    this.appendChild(t);
                })
                .on('click', function(event, d){
                    const name = (getName(d) || '').toString();
                    if(!name) return;
                    const centroid = path.centroid(d);
                    if(name.toLowerCase() === 'germany' || name.toLowerCase() === 'federal republic of germany'){
                        d3.select(this).transition().duration(180).attr('transform','scale(1.03)').transition().duration(180).attr('transform','scale(1)');
                        openDice(name);
                        return;
                    }
                    const el = d3.select(this);
                    el.classed('removed', true);
                    setTimeout(()=> el.style('display','none'), 700);
                    if(labelsSelection){
                        labelsSelection.filter(ld => getName(ld) === name)
                            .style('display','none')
                            .classed('removed', true);
                    }

                    if(Array.isArray(centroid) && svg.node()){
                        // Convert SVG centroid to screen coordinates so popup appears at the clicked country
                        try{
                            const pt = svg.node().createSVGPoint();
                            pt.x = centroid[0]; pt.y = centroid[1];
                            const screenPt = pt.matrixTransform(svg.node().getScreenCTM());
                            const left = screenPt.x;
                            const top = screenPt.y;
                            const popup = document.createElement('div');
                            popup.className = 'popup';
                            popup.textContent = `Your choice is wrong: ${name}`;
                            document.body.appendChild(popup);
                            // place slightly above the point
                            popup.style.left = left + 'px';
                            popup.style.top = (top - 12) + 'px';
                            setTimeout(()=> {
                                popup.style.transition = 'opacity 300ms';
                                popup.style.opacity = 0;
                                setTimeout(()=> popup.remove(), 350);
                            }, 2200);
                        }catch(e){
                            // fallback to previous positioning
                            const svgRect = svg.node().getBoundingClientRect();
                            const left = svgRect.left + centroid[0];
                            const top = svgRect.top + centroid[1];
                            const popup = document.createElement('div');
                            popup.className = 'popup';
                            popup.textContent = `Your choice is wrong: ${name}`;
                            document.body.appendChild(popup);
                            popup.style.left = left + 'px';
                            popup.style.top = top + 'px';
                            setTimeout(()=> {
                                popup.style.transition = 'opacity 300ms';
                                popup.style.opacity = 0;
                                setTimeout(()=> popup.remove(), 350);
                            }, 2200);
                        }
                    }

                    checkWin();
                });
                
            labelsSelection = svg.selectAll('text.country-label')
                .data(features.filter(f => (d3.geoArea(f) > 0.0009)))
                .join('text')
                .attr('class','country-label')
                .attr('data-name', d => getName(d))
                .attr('x', d => {
                    const c = path.centroid(d);
                    return c ? c[0] : 0;
                })
                .attr('y', d => {
                    const c = path.centroid(d);
                    return c ? c[1] : 0;
                })
                .text(d => getName(d));

            if(labelsSelection) labelsSelection.style('display','none');

            // Recalculate projection and redraw when the viewport size changes (mobile rotate/resize)
            function resizeMap(){
                createProjection();
                path = d3.geoPath().projection(projection);
                if(countrySelection) countrySelection.attr('d', path);
                if(labelsSelection) labelsSelection
                    .attr('x', d => { const c = path.centroid(d); return c ? c[0] : 0; })
                    .attr('y', d => { const c = path.centroid(d); return c ? c[1] : 0; });
            }

            window.addEventListener('resize', () => {
                // small debounce to avoid excessive recalculations
                clearTimeout(window.__mapResizeTimeout);
                window.__mapResizeTimeout = setTimeout(resizeMap, 120);
            });

            // Also trigger an initial resize to align with computed CSS sizes
            setTimeout(resizeMap, 50);

        }).catch(err => {
            console.error('Failed to load topology/geojson', err);
            svg.append('text').attr('x',20).attr('y',40).attr('fill','red').text('Failed to load map data. Try serving the file over HTTP (e.g. python -m http.server).');
        });

        function checkWin(){
            const remaining = svg.selectAll('path.country')
                .filter(function(){
                    const name = (this.getAttribute('data-name') || '').toLowerCase();
                    return name !== 'germany' && name !== 'federal republic of germany' && !this.classList.contains('removed');
                });
            if(remaining.size() === 0){
                const overlay = document.createElement('div');
                overlay.id = 'winOverlay';
                overlay.className = 'modal show';
                overlay.style.zIndex = 9999;
                const dialog = document.createElement('div');
                dialog.className = 'dialog';
                dialog.style.minWidth = '340px';
                dialog.innerHTML = '<h2>All cleared!</h2><p>You removed all other countries — surprise revealed! Happy Birthday!</p><div style="margin-top:12px;display:flex;justify-content:center"><button id="closeWin">Close</button></div>';
                overlay.appendChild(dialog);
                document.body.appendChild(overlay);
                document.getElementById('closeWin').addEventListener('click', ()=> overlay.remove());
            }
        }

        resetBtn.addEventListener('click', resetMap);
        closeModal.addEventListener('click', hideModal);
        resetFromModal.addEventListener('click', ()=> { resetMap(); hideModal(); });
        document.addEventListener('keydown', e => { if(e.key === 'Escape') hideModal(); });

        const diceEl = document.getElementById('dice');
        const dieFace = document.getElementById('dieFace');
        const rollDice = document.getElementById('rollDice');
        const rollsLeftEl = document.getElementById('rollsLeft');

        let diceState = { rollsLeft: 3, spinning: false };

        function showStaticPopup(message, onClose){
            const overlay = document.createElement('div');
            overlay.className = 'modal show';
            overlay.style.zIndex = 10000;
            const dialog = document.createElement('div');
            dialog.className = 'dialog';
            dialog.innerHTML = `<h2>${message.split('\\n')[0]}</h2><p style="white-space:pre-line;margin:8px 0 0">${message}</p><div style="margin-top:12px;display:flex;justify-content:center"><button id="popupOk">Okay</button></div>`;
            overlay.appendChild(dialog);
            document.body.appendChild(overlay);
            document.getElementById('popupOk').addEventListener('click', () => {
                overlay.remove();
                if(typeof onClose === 'function') onClose();
            });
        }

        function openDice(name){

            const dieEl = document.getElementById('dieFace');
            const rollsLeftEl = document.getElementById('rollsLeft');
            const rollBtn = document.getElementById('rollDice');
            if(!dieEl || !rollsLeftEl || !rollBtn) { showModal(); return; }
            diceState.rollsLeft = 3;
            diceState.spinning = false;
            rollsLeftEl.textContent = diceState.rollsLeft;
            dieEl.textContent = '—';
            document.getElementById('rollInfo').textContent = 'Rolls left: ';
            showModal();

            const newRoll = rollBtn.cloneNode(true);
            rollBtn.parentNode.replaceChild(newRoll, rollBtn);
            newRoll.addEventListener('click', () => {
                if(diceState.spinning || diceState.rollsLeft <= 0) return;
                diceState.spinning = true;
                diceState.rollsLeft--;
                rollsLeftEl.textContent = diceState.rollsLeft;

                dieEl.classList.add('spinning');

                const interval = setInterval(()=> dieEl.textContent = 1 + Math.floor(Math.random()*6), 80);

                const flips = 8 + Math.floor(Math.random()*10);
                const total = 300 + flips * 80;
                setTimeout(()=> {
                    clearInterval(interval);
                    const result = 1 + Math.floor(Math.random()*6);
                    dieEl.textContent = result;
                    dieEl.classList.remove('spinning');
                    diceState.spinning = false;

                    if(diceState.rollsLeft === 2){

                        showStaticPopup("Oh noo — not this time!\nSorry, you're not lucky yet. Try two more rolls for a chance to win a surprise.");
                    } else if(diceState.rollsLeft === 1){

                        showStaticPopup("Oooh, so close!\nOne more roll could win you a gift!");
                    } else if(diceState.rollsLeft === 0){

                        showStaticPopup("Way! You won a gift from your beloved trip to Munich 🎉\nTrip dates: 20–23 November 2026\nClick Okay to claim and reset the map.", () => {
                            resetMap();
                            hideModal();
                        });
                    }

                    if(diceState.rollsLeft === 0){
                        document.getElementById('rollInfo').textContent = 'No rolls left. Close or Reset.';
                    }
                }, total);
            });
        }
    })();
    </script>
</body>
</html>
